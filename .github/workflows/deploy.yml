name: Deploy

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-crm.your-domain.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci --legacy-peer-deps

    - name: Build application
      working-directory: ./backend
      run: npm run build

    - name: Run database migrations
      working-directory: ./backend
      run: npm run migration:run
      env:
        DB_HOST: ${{ secrets.STAGING_DB_HOST }}
        DB_PORT: ${{ secrets.STAGING_DB_PORT }}
        DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}

    # Deploy to your preferred platform
    # Uncomment and configure based on your needs:

    # === HEROKU ===
    # - name: Deploy to Heroku
    #   uses: akhileshns/heroku-deploy@v3.13.15
    #   with:
    #     heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
    #     heroku_app_name: crm-staging
    #     heroku_email: ${{ secrets.HEROKU_EMAIL }}

    # === DOCKER / K8S ===
    # - name: Deploy Docker container
    #   run: |
    #     echo "Deploying Docker image to staging..."
    #     # kubectl apply -f k8s/staging/

    # === SSH DEPLOY ===
    # - name: Deploy via SSH
    #   uses: appleboy/ssh-action@v1.0.0
    #   with:
    #     host: ${{ secrets.STAGING_HOST }}
    #     username: ${{ secrets.STAGING_USERNAME }}
    #     key: ${{ secrets.STAGING_SSH_KEY }}
    #     script: |
    #       cd /var/www/crm-backend
    #       git pull origin main
    #       npm install
    #       npm run build
    #       pm2 restart crm-backend

    - name: Notify deployment success
      run: echo "✅ Deployed to staging successfully!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://crm.your-domain.com
    needs: []

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci --legacy-peer-deps

    - name: Build application
      working-directory: ./backend
      run: npm run build

    - name: Run database migrations
      working-directory: ./backend
      run: npm run migration:run
      env:
        DB_HOST: ${{ secrets.PROD_DB_HOST }}
        DB_PORT: ${{ secrets.PROD_DB_PORT }}
        DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.PROD_DB_DATABASE }}

    # === HEALTH CHECK BEFORE DEPLOY ===
    - name: Pre-deployment health check
      run: |
        curl -f https://crm.your-domain.com/health || echo "Current production is down"

    # Deploy to production (configure based on your platform)

    # === POST-DEPLOY HEALTH CHECK ===
    - name: Post-deployment health check
      run: |
        sleep 30
        curl -f https://crm.your-domain.com/health

    # === ROLLBACK ON FAILURE ===
    - name: Rollback on failure
      if: failure()
      run: |
        echo "❌ Deployment failed! Rolling back..."
        # Add rollback commands here

    - name: Notify deployment success
      if: success()
      run: echo "🚀 Deployed to production successfully!"

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Notify via Slack
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Deployment Status: ${{ job.status }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

    # - name: Notify via Discord
    #   uses: sarisia/actions-status-discord@v1
    #   if: always()
    #   with:
    #     webhook: ${{ secrets.DISCORD_WEBHOOK }}
    #     status: ${{ job.status }}
